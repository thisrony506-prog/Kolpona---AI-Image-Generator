name: Android Release

on:
  push:
    branches: [main, master, "arena/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 35
        run: |
          set -e
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Write local.properties
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: |
          SDK_PATH="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/android-sdk}}"
          {
            echo "sdk.dir=${SDK_PATH}"
            echo "POLLINATIONS_API_KEY=${POLLINATIONS_API_KEY}"
          } > local.properties
          echo "local.properties sdk.dir=$(grep sdk.dir local.properties)"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --no-daemon --warning-mode all | tee gradle-build.log

      - name: Annotate Gradle failure
        if: failure()
        run: |
          python3 - << 'PY'
          from pathlib import Path
          p = Path("gradle-build.log")
          text = p.read_text(errors="replace") if p.exists() else "no gradle-build.log"
          lines = text.splitlines()
          hits = []
          for i, line in enumerate(lines):
              if any(s in line for s in ("FAILURE", "What went wrong", "error:", "e: file://", "Could not", "Execution failed")):
                  hits.extend(lines[max(0, i):min(len(lines), i + 12)])
          snippet = "\n".join(hits[-100:] or lines[-80:])[-5500:]
          for line in snippet.splitlines() or ["unknown gradle failure"]:
              print(f"::error::{line}")
          PY

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: ignore

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
