name: Android Release

on:
  push:
    branches: [main, master, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  checks: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;34.0.0" "platform-tools"

      - name: Write local.properties
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
        run: |
          export SDK_PATH="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          python3 - << 'PY'
          import os
          from pathlib import Path
          sdk = os.environ.get("SDK_PATH") or os.environ.get("ANDROID_SDK_ROOT") or os.environ.get("ANDROID_HOME") or ""
          lines = [f"sdk.dir={sdk}"]
          for name in ("POLLINATIONS_API_KEY", "HUGGINGFACE_API_KEY"):
              value = os.environ.get(name, "")
              lines.append(f"{name}={value}")
          Path("local.properties").write_text("\n".join(lines) + "\n")
          print(f"Using SDK {sdk}")
          PY

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 - << 'PY'
          import os
          from pathlib import Path
          dest = Path("app/google-services.json")
          raw = os.environ.get("GOOGLE_SERVICES_JSON", "").strip()
          if dest.exists() and dest.stat().st_size > 0:
              print("google-services.json already present")
          elif raw:
              dest.write_text(raw if raw.endswith("\n") else raw + "\n")
              print("wrote google-services.json from secret")
          else:
              print("google-services.json missing; Firebase plugin will be skipped")
          PY

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee gradle-build.log

      - name: Publish Gradle failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'PY'
          from pathlib import Path
          text = Path("gradle-build.log").read_text(errors="replace") if Path("gradle-build.log").exists() else "no gradle-build.log"
          lines = text.splitlines()
          errors = [l for l in lines if l.startswith("e: ") or l.startswith("e:file:") or "Unresolved reference" in l or "error: " in l]
          if not errors:
              errors = [l for l in lines if "What went wrong" in l or l.startswith("FAILURE")]
          snippet = "\n".join(errors[:80] or lines[-60:])[-12000:]
          Path("/tmp/fail.md").write_text("Kolpona CI Gradle failure:\n\n```\n" + snippet + "\n```\n")
          print(snippet)
          PY
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -f body="$(cat /tmp/fail.md)" || true

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: ignore

      - name: Write update manifest
        if: success()
        run: |
          python3 - << 'PY'
          import hashlib, json, os, re
          from pathlib import Path
          gradle = Path("app/build.gradle.kts").read_text()
          code = int(re.search(r"versionCode\s*=\s*(\d+)", gradle).group(1))
          name = re.search(r'versionName\s*=\s*"([^"]+)"', gradle).group(1)
          apk = Path("app/build/outputs/apk/release/app-release.apk")
          sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          repo = os.environ["GITHUB_REPOSITORY"]
          url = f"https://github.com/{repo}/releases/download/kolpona-release-apk/app-release.apk"
          manifest = {
              "versionCode": code,
              "versionName": name,
              "apkUrl": url,
              "sha256": sha,
              "force": True,
              "notes": f"Kolpona {name}"
          }
          text = json.dumps(manifest, indent=2) + "\n"
          Path("version.json").write_text(text)
          Path("release").mkdir(exist_ok=True)
          Path("release/version.json").write_text(text)
          print(text)
          PY

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          ls -la app/build/outputs/apk/release/
          ls -la version.json
          gh release delete kolpona-release-apk --yes || true
          gh release create kolpona-release-apk "$APK" version.json \
            --title "Kolpona Release APK" \
            --notes "Force-update manifest + APK from ${GITHUB_SHA} (Actions run ${GITHUB_RUN_ID}). Old installs must update in-app before use." \
            --target "$GITHUB_SHA"

      - name: Commit Release APK
        if: success()
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/app-release.apk
          ls -la release/app-release.apk release/version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/app-release.apk release/version.json
          if git diff --cached --quiet; then
            echo "APK unchanged"
            exit 0
          fi
          git commit -m "Add GitHub Actions Release APK [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
