name: Android Release

on:
  push:
    branches: [main, master, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  checks: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;34.0.0" "platform-tools"

      - name: Write local.properties
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: |
          SDK_PATH="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          printf 'sdk.dir=%s\nPOLLINATIONS_API_KEY=%s\n' "$SDK_PATH" "$POLLINATIONS_API_KEY" > local.properties
          echo "Using SDK $SDK_PATH"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee gradle-build.log

      - name: Publish Gradle failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'PY'
          from pathlib import Path
          text = Path("gradle-build.log").read_text(errors="replace") if Path("gradle-build.log").exists() else "no gradle-build.log"
          lines = text.splitlines()
          errors = [l for l in lines if l.startswith("e: ") or l.startswith("e:file:") or "Unresolved reference" in l or "error: " in l]
          if not errors:
              errors = [l for l in lines if "What went wrong" in l or l.startswith("FAILURE")]
          snippet = "\n".join(errors[:80] or lines[-60:])[-12000:]
          Path("/tmp/fail.md").write_text("Kolpona CI Gradle failure:\n\n```\n" + snippet + "\n```\n")
          print(snippet)
          PY
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -f body="$(cat /tmp/fail.md)" || true

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: ignore

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
